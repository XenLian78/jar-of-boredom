
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The jar of Boredom - Πρόσθεσε Ιδέα</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="top-nav" style="justify-content: flex-end;">
            <a href="jar-view.html">Παράλειψη &gt;</a>
        </div>

        <div class="main-card" style="text-align: center;">
            <h2 style="color: var(--dark-text); font-size: 22px; margin-bottom: 10px;">ΓΡΑΨΕ ΜΙΑ ΙΔΕΑ ΚΑΙ<br>ΤΟΠΟΘΕΤΗΣΕ ΤΗΝ ΣΤΟ ΒΑΖΟ</h2>
            <p style="color: #666; font-size: 14px; margin-bottom: 25px;">Επανέλαβε για περισσότερες ιδέες</p>

            <input type="text" id="ideaInput" class="idea-input" placeholder="Γράψε μια ιδέα...">

            <button class="start-btn" id="addBtn">Βάλε την ιδέα στο βάζο</button>
            <button class="start-btn btn-orange" onclick="window.location.href='jar-view.html'">Δες το βάζο σου</button>

            <div style="margin-top: auto; padding-top: 20px; width: 100%; display: flex; justify-content: center;">
                <img src="assets/images/idea-man.png" style="width: 170px; margin-bottom: -25px;" alt="Idea Character">
            </div>
        </div>

        <footer>
            <img src="assets/images/logo-boredom-jar.svg" style="width: 70px;" alt="Bored Jar Logo">
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>

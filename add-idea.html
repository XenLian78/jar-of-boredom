<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The jar of Boredom - Πρόσθεσε Ιδέα</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="top-nav" style="justify-content: flex-end;">
            <a href="jar-view.html">Παράλειψη &gt;</a>
        </div>

        <div class="main-card">
            <div style="text-align: center; margin-top: 10px;">
                <h2 style="color: var(--dark-text); font-size: 20px; text-transform: uppercase;">ΓΡΑΨΕ ΜΙΑ ΙΔΕΑ ΚΑΙ<br>ΤΟΠΟΘΕΤΗΣΕ ΤΗΝ ΣΤΟ ΒΑΖΟ</h2>
                <p style="color: #666; font-size: 14px; margin-top: 5px;">Επανέλαβε για περισσότερες ιδέες</p>
            </div>

            <div style="width: 100%; margin-top: 25px;">
                <input type="text" id="ideaInput" class="idea-input" placeholder="Γράψε μια ιδέα...">
                <button class="start-btn" id="addBtn" style="background-color: #DDE2EE;">ΒΑΛΕ ΤΗΝ ΙΔΕΑ ΣΤΟ ΒΑΖΟ</button>
                <button class="start-btn btn-orange" onclick="window.location.href='jar-view.html'">ΔΕΣ ΤΟ ΒΑΖΟ ΣΟΥ</button>
            </div>

            <div class="character-container">
                <img src="assets/images/idea-man.png" class="character-img" alt="Idea Character">
            </div>
        </div>

        <footer>
            <img src="assets/images/logo-boredom-jar.svg" style="width: 70px;" alt="Bored Jar Logo">
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>

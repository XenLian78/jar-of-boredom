

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bored Jar - Αρχική</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header style="text-align:center; margin: 30px 0 20px 0;">
            <h1 style="color:var(--dark-text); font-family:serif; line-height:1.2;">Welcome to<br>Bored Jar</h1>
        </header>

        <div class="main-card">
            <div class="categories-grid">
                <div class="cat"><img src="assets/images/explore-icon.png"><p>Explore</p></div>
                <div class="cat"><img src="assets/images/create-icon.png"><p>Create</p></div>
                <div class="cat"><img src="assets/images/learn-icon.png"><p>Learn</p></div>
                <div class="cat"><img src="assets/images/help-icon.png"><p>Help</p></div>
                <div class="cat"><img src="assets/images/play-icon.png"><p>Play</p></div>
                <div class="cat"><img src="assets/images/relax-icon.png"><p>Relax</p></div>
            </div>

            <div style="margin: 10px 0;">
                <img src="assets/images/main_characters.png" style="width: 280px;" alt="Characters">
            </div>

            <button class="start-btn btn-orange" style="margin-top:auto;" onclick="window.location.href='add-idea.html'">ΞΕΚΙΝΑΜΕ</button>
        </div>

        <footer>
            <img src="assets/images/logo-bored-jar.svg" class="logo-bottom" alt="Logo">
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>

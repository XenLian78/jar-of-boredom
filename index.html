
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bored Jar - Αρχική</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1 class="main-title">
                <span>Welcome to</span><br>
                <span>Bored Jar</span>
            </h1>
        </header>

        <div class="main-card">
            <div class="categories-grid">
                <div class="cat"><img src="assets/images/explore-icon.png" alt="Explore"><p>Explore</p></div>
                <div class="cat"><img src="assets/images/create-icon.png" alt="Create"><p>Create</p></div>
                <div class="cat"><img src="assets/images/learn-icon.png" alt="Learn"><p>Learn</p></div>
                <div class="cat"><img src="assets/images/help-icon.png" alt="Help"><p>Help</p></div>
                <div class="cat"><img src="assets/images/play-icon.png" alt="Play"><p>Play</p></div>
                <div class="cat"><img src="assets/images/relax-icon.png" alt="Relax"><p>Relax</p></div>
            </div>

            <div style="margin-top: 10px; width: 100%; text-align: center; margin-bottom: 25px;">
                <img src="assets/images/main_characters.png" style="width: 90%; max-width: 300px; display: inline-block;" alt="Characters">
            </div>

            <button class="start-btn btn-orange" onclick="window.location.href='add-idea.html'">ΞΕΚΙΝΑΜΕ</button>
        </div>

        <footer>
            <img src="assets/images/logo-bored-jar.svg" style="width: 80px;" alt="Bored Jar Logo">
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>



<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bored Jar - Το Βάζο σου</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="top-nav">
            <a href="index.html"> < Πίσω</a>
        </div>

        <div class="main-card">
            <header>
                <h1 class="main-title">ΤΟ ΒΑΖΟ ΣΟΥ</h1>
                <p style="color: #718096; font-size: 14px;">Διαχείριση ιδεών</p>
            </header>

            <div id="ideaList" class="idea-list-container">
                </div>

            <button class="start-btn" id="drawBtn">ΕΝΑΡΞΗ ΠΑΙΧΝΙΔΙΟΥ</button>

            <div class="draw-area" id="drawArea" style="display:none;">
                <div id="cloudContainer">
                    <img src="cloud-bubble.svg" id="cloudImg" alt="Cloud">
                    <div id="selectedIdea"></div>
                </div>
                
                <div class="jar-wrapper">
                    <img src="jar-empty.png" id="jarBody" alt="Jar">
                </div>

                <div style="width: 100%; display: flex; gap: 10px; margin-top: 20px;">
                    <button class="start-btn btn-success" id="doneBtn" style="background-color: #28a745; color: white;">ΤΟ ΕΚΑΝΑ!</button>
                    <button class="start-btn" id="nextBtn">ΑΛΛΟ ΕΝΑ...</button>
                </div>
            </div>
        </div>

        <footer>
            <img src="logo-footer.png" alt="Bored Jar Logo" style="width: 80px;">
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>

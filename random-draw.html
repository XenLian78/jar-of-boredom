<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The jar of Boredom - Κλήρωση!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="top-nav">
            <a href="jar-view.html">&lt; Πίσω</a>
        </div>

        <div class="main-card">
            <div class="draw-area">
                <div id="cloudContainer">
                    <img src="assets/images/cloud-bubble.svg" id="cloudImg" alt="Cloud">
                    <div id="selectedIdea">Εδώ θα μπει η ιδέα!</div>
                </div>

                <div class="jar-wrapper" id="fullJar">
                    <img src="assets/images/jar-body.svg" id="jarBody" alt="Jar">
                </div>
            </div>

            <div class="controls-area">
                <div id="actionButtons" style="width: 100%;">
                    <button class="start-btn btn-orange" onclick="drawIdea()">ΔΙΑΛΕΞΕ ΓΙΑ ΜΕΝΑ</button>
                </div>
                
                <div id="resultButtons" style="width: 100%; display: none; flex-direction: column;">
                    <button class="start-btn" onclick="doneIdea()" style="background-color: var(--success-green); color: white;">ΤΟ ΕΚΑΝΑ!</button>
                    <button class="start-btn" onclick="drawIdea()">ΔΙΑΛΕΞΕ ΞΑΝΑ</button>
                </div>
            </div>
        </div>

        <footer>
            <img src="assets/images/logo-boredom-jar.svg" style="width: 70px;" alt="Bored Jar Logo">
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Κλήρωση</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="top-nav">
            <a href="jar-view.html" class="nav-link">❮ Πίσω</a>
        </div>
        <div class="main-card" style="justify-content: center;">
            
            <div id="cloudContainer" style="display:none; text-align:center; margin-bottom:20px;">
                <div style="background: #f0f0f0; padding: 20px; border-radius: 50px; position: relative;">
                    <p id="selectedIdea" style="font-size: 22px; font-weight: 600;"></p>
                </div>
                <div style="width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 20px solid #f0f0f0; margin: 0 auto;"></div>
            </div>

            <div class="jar-wrapper" id="jar">
                <img src="assets/images/jar-lid.png" id="jarLid">
                <img src="assets/images/jar-body.png" id="jarBody">
            </div>

            <button id="drawBtn" class="orange-btn" onclick="drawIdea()">ΔΙΑΛΕΞΕ ΓΙΑ ΜΕΝΑ</button>
            
            <div id="postDrawButtons" style="display:none; width:100%; gap:10px;">
                <button class="gray-btn" style="background:#28a745; color:white;" onclick="doneIdea()">ΤΟ ΕΚΑΝΑ!</button>
                <button class="gray-btn" onclick="location.reload()">ΑΛΛΟ ΕΝΑ...</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
